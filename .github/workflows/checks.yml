name: Export checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Unit and packaging tests (no provider credentials)
        run: find . -name '*.test.mjs' -not -path '*/node_modules/*' -print0 | xargs -0 node --test
      - name: Icon verifier regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Pinned icon integrity
        run: python3 scripts/vendor-icons.py
      - name: Attribution travels with installed mods
        run: python3 scripts/package-notices.py --check
      - name: Canonical displayed previews match their generator
        run: |
          python3 scripts/build-previews.py
          git diff --exit-code -- '*/preview.svg'
      - name: Export hygiene
        run: python3 scripts/check-export.py
